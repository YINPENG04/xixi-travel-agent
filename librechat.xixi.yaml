version: 1.3.13
cache: true

# Native LibreChat memory persists to MongoDB. Xixi uses its MCP tools instead:
# MySQL is the long-term source of truth, Milvus provides per-user semantic
# retrieval, and Redis stores short-term task state and retrieval caches.
memory:
  disabled: true

# Keep recent turns verbatim, progressively trim old large tool outputs, and
# create an incremental checkpoint before the model context is exhausted.
summarization:
  enabled: true
  trigger:
    type: token_ratio
    value: 0.80
  reserveRatio: 0.05
  maxSummaryTokens: 2000
  retainRecent:
    turns: 6
    tokens: 8000
  contextPruning:
    enabled: true
    keepLastAssistants: 4
    softTrimRatio: 0.30
    hardClearRatio: 0.60
    minPrunableToolChars: 4000

interface:
  contextUsage: true
  privacyPolicy:
    externalUrl: https://example.com/privacy
    openNewTab: true
  termsOfService:
    externalUrl: https://example.com/terms
    openNewTab: true

registration:
  socialLogins: []

mcpServers:
  xixi-rides:
    type: sse
    url: http://ride-service:8081/sse
    timeout: 30000
    serverInstructions: |
      Use a bounded ReAct-style loop for Xixi travel tasks. Keep private reasoning
      private; expose only concise conclusions, tool actions, and evidence.
      1. Start each user task with travelTaskStart. If the result is ambiguous,
         UNKNOWN, or asks for missing slots, clarify before calling a business tool.
      2. Execute only the returned nextAction. After each tool or user confirmation,
         call travelTaskObserve with the latest taskId and version. Use travelTaskGet after
         waiting or resuming a conversation.
      3. For travelKnowledgeSearch, start with an empty cycleId and inspect
         terminal, retrievalStatus, observationReason, topScore, and scoreGap.
         If terminal is false, rewrite the query with the missing place, vehicle,
         policy, safety, or invoice entity and retry with the returned cycleId.
      4. The backend permits at most two searches per cycle and rejects an
         unchanged retry. When terminal is true, stop searching. If no evidence
         was found, say so explicitly and do not invent a rule.
      5. Do not create or cancel an order without the prepare-confirm-execute
         flow and an explicit user confirmation between prepare and execute.
      6. When long-term memory values conflict, show both values and obtain an
         explicit KEEP_EXISTING, REPLACE, or MERGE choice. Never store credentials,
         identifiers, payment data, or temporary order state as long-term memory.
      7. Stop the loop as soon as the answer is supported or the requested
         business action reaches a terminal result.

endpoints:
  agents:
    disableBuilder: false
    capabilities:
      - execute_code
      - file_search
      - actions
      - tools
