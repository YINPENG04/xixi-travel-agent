name: xixi-travel

services:
  ride-service:
    build:
      context: ./services/ride-service
    restart: unless-stopped
    environment:
      PORT: 8081
      XIXI_KNOWLEDGE_BASE_URL: http://knowledge-service:8090
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-xixi}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-xixi}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-xixi-local-only}
      SPRING_DATA_REDIS_URL: redis://redis:6379
      XIXI_REDIS_ENABLED: "true"
      XIXI_ORDER_CACHE_TTL: ${XIXI_ORDER_CACHE_TTL:-2m}
      XIXI_MEMORY_CACHE_TTL: ${XIXI_MEMORY_CACHE_TTL:-30m}
      XIXI_MEMORY_SEARCH_CACHE_TTL: ${XIXI_MEMORY_SEARCH_CACHE_TTL:-10m}
      XIXI_SESSION_CONTEXT_TTL: ${XIXI_SESSION_CONTEXT_TTL:-30m}
      XIXI_MEMORY_INDEX_ENABLED: ${XIXI_MEMORY_INDEX_ENABLED:-true}
      XIXI_MEMORY_INDEX_URL: http://knowledge-service:8090
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      XIXI_MESSAGING_ENABLED: "true"
      XIXI_RIDE_EVENT_TOPIC: ${XIXI_RIDE_EVENT_TOPIC:-xixi-ride-events}
      XIXI_DISPATCH_DELAY_LEVEL: ${XIXI_DISPATCH_DELAY_LEVEL:-2}
      XIXI_TIMEOUT_DELAY_LEVEL: ${XIXI_TIMEOUT_DELAY_LEVEL:-4}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 6
    depends_on:
      knowledge-service:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy

  mongodb:
    profiles: ["librechat"]
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xixi}
      MYSQL_USER: ${MYSQL_USER:-xixi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-xixi-local-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-xixi-root-local-only}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  rocketmq-namesrv:
    image: apache/rocketmq:5.5.0
    restart: unless-stopped
    command: ["sh", "mqnamesrv"]
    ports:
      - "9876:9876"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9876'"]
      interval: 10s
      timeout: 5s
      retries: 12

  rocketmq-broker:
    image: apache/rocketmq:5.5.0
    restart: unless-stopped
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: -Xms512m -Xmx512m -Xmn256m
    command: ["sh", "mqbroker", "-n", "rocketmq-namesrv:9876", "-c", "/home/rocketmq/broker.conf"]
    ports:
      - "10909:10909"
      - "10911:10911"
    volumes:
      - rocketmq-store:/home/rocketmq/store
      - ./services/rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n rocketmq-namesrv:9876 | grep broker-a"]
      interval: 10s
      timeout: 5s
      retries: 12

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - etcd-data:/etcd

  minio:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-xixi-minio-local}
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio-data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.5.12
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  knowledge-init:
    build:
      context: ./knowledge
    command: ["python", "seed_milvus.py"]
    restart: "no"
    environment:
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      XIXI_USER_MEMORY_COLLECTION: ${XIXI_USER_MEMORY_COLLECTION:-xixi_user_memories}
    volumes:
      - huggingface-cache:/models
    depends_on:
      milvus:
        condition: service_healthy

  knowledge-service:
    build:
      context: ./knowledge
    restart: unless-stopped
    environment:
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      XIXI_RAG_MIN_SCORE: ${XIXI_RAG_MIN_SCORE:-0.30}
      XIXI_RAG_CANDIDATE_MULTIPLIER: ${XIXI_RAG_CANDIDATE_MULTIPLIER:-4}
      XIXI_RAG_SEMANTIC_WEIGHT: ${XIXI_RAG_SEMANTIC_WEIGHT:-0.95}
      XIXI_RAG_KEYWORD_WEIGHT: ${XIXI_RAG_KEYWORD_WEIGHT:-0.05}
      XIXI_RERANK_RETRIEVAL_WEIGHT: ${XIXI_RERANK_RETRIEVAL_WEIGHT:-0.90}
      XIXI_RERANK_CANDIDATE_MULTIPLIER: ${XIXI_RERANK_CANDIDATE_MULTIPLIER:-1}
      XIXI_RERANKER_MODEL: ${XIXI_RERANKER_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}
      XIXI_USER_MEMORY_COLLECTION: ${XIXI_USER_MEMORY_COLLECTION:-xixi_user_memories}
      XIXI_MEMORY_MIN_SCORE: ${XIXI_MEMORY_MIN_SCORE:-0.35}
    ports:
      - "8090:8090"
    volumes:
      - huggingface-cache:/models
    depends_on:
      knowledge-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 15s
      timeout: 5s
      retries: 12

  meilisearch:
    profiles: ["librechat"]
    image: getmeili/meilisearch:v1.15
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-xixi-local-search}
    volumes:
      - meili-data:/meili_data

  librechat:
    profiles: ["librechat"]
    build:
      context: ./vendor/LibreChat
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-xixi-local-search}
      REDIS_URI: redis://redis:6379
    volumes:
      - ./librechat.xixi.yaml:/app/librechat.yaml:ro
    ports:
      - "3080:3080"
    depends_on:
      - mongodb
      - redis
      - meilisearch
      - ride-service

volumes:
  mongodb-data:
  mysql-data:
  redis-data:
  rocketmq-store:
  etcd-data:
  minio-data:
  milvus-data:
  meili-data:
  huggingface-cache:
