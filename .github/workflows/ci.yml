name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test

  ride-service:
    name: Ride service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ride-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        run: mvn --batch-mode test
