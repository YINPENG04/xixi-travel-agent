name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test

  ride-service:
    name: Ride service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ride-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Start RocketMQ for broker integration test
        run: docker compose -f ../../docker-compose.xixi.yml up -d --wait rocketmq-broker
      - name: Test
        env:
          XIXI_ROCKETMQ_IT: "true"
        run: mvn --batch-mode test
      - name: Stop integration services
        if: always()
        run: docker compose -f ../../docker-compose.xixi.yml down -v

  knowledge:
    name: RAG checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install retrieval test dependencies
        run: pip install jieba==0.42.1 rank-bm25==0.2.2
      - name: Check Python files
        run: python -m py_compile knowledge/seed_milvus.py knowledge/rag_service.py knowledge/hybrid_retrieval.py knowledge/evaluate_retrieval.py knowledge/evaluate_offline.py knowledge/evaluation/generate_benchmark.py
      - name: Test retrieval
        run: python -m unittest discover -s knowledge/tests -v
