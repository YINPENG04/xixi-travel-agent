spring:
  application:
    name: xixi-ride-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/xixi?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:xixi}
    password: ${SPRING_DATASOURCE_PASSWORD:xixi-local-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  ai:
    mcp:
      server:
        name: xixi-ride-tools
        version: 0.1.0
        type: SYNC
        instructions: >
          嘻嘻出行工具提供知识检索、报价、创建订单、查询状态、取消订单、异步通知和发票资格查询能力。
          回答地点别名、车型、报价规则、安全要求或发票政策前，优先调用知识检索工具，
          只根据检索结果中存在的事实回答；没有匹配资料时应明确说明。
          创建或取消订单前必须取得用户明确确认。
        sse-message-endpoint: /mcp/messages

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: xixi-ride-producer
    send-message-timeout: 5000

xixi:
  knowledge-base-url: ${XIXI_KNOWLEDGE_BASE_URL:http://localhost:8090}
  messaging:
    enabled: ${XIXI_MESSAGING_ENABLED:false}
    topic: ${XIXI_RIDE_EVENT_TOPIC:xixi-ride-events}
    send-timeout-ms: ${XIXI_MQ_SEND_TIMEOUT_MS:5000}
    dispatch-delay-level: ${XIXI_DISPATCH_DELAY_LEVEL:2}
    timeout-delay-level: ${XIXI_TIMEOUT_DELAY_LEVEL:4}
    outbox-poll-delay-ms: ${XIXI_OUTBOX_POLL_DELAY_MS:1000}

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: 嘻嘻出行
    description: 智能出行 Agent、MySQL、RocketMQ 事件驱动业务与 MCP 服务
