spring:
  datasource:
    url: jdbc:h2:mem:xixi;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

xixi:
  cache:
    enabled: false
  memory:
    semantic-index-enabled: false
  messaging:
    enabled: false

rocketmq:
  name-server: localhost:9876
  producer:
    group: xixi-ride-test-producer
